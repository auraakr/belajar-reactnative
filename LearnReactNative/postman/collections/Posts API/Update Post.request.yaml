$kind: http-request
method: PUT
url: '{{base_url}}/api/posts/:id'
order: 4000
pathVariables:
  - key: id
    value: '1'
    description: The ID of the post to update
body:
  type: formdata
  content:
    - key: title
      type: text
      value: 'Updated Post Title'
      description: Updated title of the post
    - key: image
      type: file
      src: ''
      description: Updated image file for the post
